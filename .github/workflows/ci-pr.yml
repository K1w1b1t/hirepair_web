name: CI PR (lint, format, typecheck, test, build)

on:
  pull_request:
    branches:
      - master
      - release

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Lint, Format Check, Typecheck, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      # O build da API usa tsconfig.build.json, que exclui **/*spec.ts.
      # O typecheck roda no tsconfig.json completo e cobre também os testes.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build
        env:
          DATABASE_URL: postgresql://hirepair:hirepair_secret@localhost:5434/hirepair
