name: CI (quality, E2E and migration validation)

on:
  pull_request:
    branches:
      - master
      - release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, Format Check, Typecheck, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres descartável para validar as migrations. NÃO é o Supabase: o CI
    # nunca toca no banco gerenciado. A porta 5434 é a mesma do
    # docker-compose.yml local, para que a DATABASE_URL abaixo seja a mesma do
    # .env.example e não exista uma segunda string para manter em sincronia.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hirepair
          POSTGRES_USER: hirepair
          POSTGRES_PASSWORD: hirepair_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U hirepair -d hirepair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hirepair:hirepair_secret@localhost:5434/hirepair?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # O postinstall de apps/api roda `prisma generate`, então o Prisma Client
      # existe a partir daqui — é o que permite typecheck, test e build sem banco.
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      # O build da API usa tsconfig.build.json, que exclui **/*spec.ts.
      # O typecheck roda no tsconfig.json completo e cobre também os testes.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Enforce complete unit coverage for interview changes
        run: |
          npm run test:cov -w @hirepair/interview-engine
          npm run test:cov -w @hirepair/web -- --runInBand --collectCoverageFrom='src/app/conversa/_components/{conversation-page-client,header-profile,interview-workspace,job-example-step,resume-review,voice-text-field,wizard-shell}.tsx' --collectCoverageFrom='src/app/conversa/_components/use-guided-voice.ts' --collectCoverageFrom='src/app/conversa/_lib/{engine-storage,guest-api,interview-session,interview-blocks,journey-storage,resume-presentation}.ts' --collectCoverageFrom='src/app/conversa/_lib/render-pdf.tsx' --collectCoverageFrom='src/app/meus-curriculos/resume-library.tsx' --collectCoverageFrom='src/analytics/analytics.ts' --coverageThreshold='{"global":{"statements":100,"branches":100,"functions":100,"lines":100}}'
          npm run test:cov -w @hirepair/api -- --runInBand --collectCoverageFrom='{guest/{guest-quota.service,guest.module},interview/{block.service,preparation.controller,evaluation},operational/ai-budget.service}.ts' --coverageThreshold='{"global":{"statements":100,"branches":100,"functions":100,"lines":100}}'

      - name: Validate operational limits against disposable Redis
        run: npm run test:operational -w apps/api

      - name: Evaluate guided interview fixtures without provider calls
        run: npm run eval:interview -w apps/api

      - name: Evaluate grounded writing fixtures without provider calls
        run: npm run eval:writing -w apps/api

      - name: Evaluate complete journey contracts without provider calls
        run: npm run eval:journey -w apps/api

      - name: Run build
        run: npm run build

      # Prova que as migrations aplicam num banco VAZIO, na ordem. É o mesmo
      # comando que o prestart:prod roda no deploy: se falhar aqui, o app não
      # sobe em produção.
      - name: Apply migrations to a clean database
        run: npm run db:deploy

      # Guarda contra o erro mais comum de Prisma: editar schema.prisma e
      # esquecer de gerar a migration. Compara o banco RECÉM-MIGRADO do passo
      # anterior com o schema.prisma; qualquer diferença significa que o schema
      # mudou sem migration correspondente. `--exit-code` sai 2 quando há diff.
      - name: Check for schema drift
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      # O seed é fixture de desenvolvimento, mas quebra silenciosamente quando o
      # schema muda. Roda duas vezes: a segunda prova a idempotência dos upserts.
      - name: Run seed twice (idempotency)
        run: |
          npm run db:seed
          npm run db:seed

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

  journey-integration:
    name: Real HTTP journey and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hirepair_eval
          POSTGRES_USER: hirepair
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U hirepair -d hirepair_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ format('postgresql://hirepair:{0}@127.0.0.1:15434/hirepair_eval', github.run_id) }}
      INTEGRATION_DATABASE_URL: ${{ format('postgresql://hirepair:{0}@127.0.0.1:15434/hirepair_eval', github.run_id) }}
      INTEGRATION_REDIS_URL: redis://127.0.0.1:16379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies without implicit lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Initialize the audited Prisma engine and workspace artifacts
        run: |
          node node_modules/@prisma/engines/scripts/postinstall.js
          npm run db:generate
          npm run build -w @hirepair/interview-engine
      - run: npm run db:deploy
      - run: npm run test:journey:http -w apps/api
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e:integration -w apps/web
      - name: Upload synthetic journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-integration
          path: |
            apps/web/playwright-report/integration/
            apps/web/test-results/
          if-no-files-found: warn
