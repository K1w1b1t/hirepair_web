name: CI (quality, E2E and migration validation)

on:
  pull_request:
    branches:
      - master
      - release
  push:
    branches:
      - master
      - release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, Format Check, Typecheck, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres descartável para validar as migrations. NÃO é o Supabase: o CI
    # nunca toca no banco gerenciado. A porta 5434 é a mesma do
    # docker-compose.yml local, para que a DATABASE_URL abaixo seja a mesma do
    # .env.example e não exista uma segunda string para manter em sincronia.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hirepair
          POSTGRES_USER: hirepair
          POSTGRES_PASSWORD: hirepair_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U hirepair -d hirepair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hirepair:hirepair_secret@localhost:5434/hirepair?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O postinstall de apps/api roda `prisma generate`, então o Prisma Client
      # existe a partir daqui — é o que permite typecheck, test e build sem banco.
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      # O build da API usa tsconfig.build.json, que exclui **/*spec.ts.
      # O typecheck roda no tsconfig.json completo e cobre também os testes.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build

      # Prova que as migrations aplicam num banco VAZIO, na ordem. É o mesmo
      # comando que o prestart:prod roda no deploy: se falhar aqui, o app não
      # sobe em produção.
      - name: Apply migrations to a clean database
        run: npm run db:deploy

      # Guarda contra o erro mais comum de Prisma: editar schema.prisma e
      # esquecer de gerar a migration. Compara o banco RECÉM-MIGRADO do passo
      # anterior com o schema.prisma; qualquer diferença significa que o schema
      # mudou sem migration correspondente. `--exit-code` sai 2 quando há diff.
      - name: Check for schema drift
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      # O seed é fixture de desenvolvimento, mas quebra silenciosamente quando o
      # schema muda. Roda duas vezes: a segunda prova a idempotência dos upserts.
      - name: Run seed twice (idempotency)
        run: |
          npm run db:seed
          npm run db:seed

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
