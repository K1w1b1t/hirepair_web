name: Supabase Migrations Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - master
      - main
      - release
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/prisma.config.ts'
      - 'apps/api/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-migrations.yml'

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'release' && 'Preview' || 'Production' }}
    env:
      DIRECT_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check required secret
        run: test -n "$DIRECT_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy
