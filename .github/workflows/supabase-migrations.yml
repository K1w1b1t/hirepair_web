name: Supabase Migrations Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - master
      - main
      - release

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'release' && 'Staging' || 'Production' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check required secret
        run: test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy
