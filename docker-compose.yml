services:
  db:
    image: postgres:16-alpine
    container_name: hirepair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hirepair}
      POSTGRES_USER: ${POSTGRES_USER:-hirepair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirepair_secret}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - hirepair_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hirepair} -d ${POSTGRES_DB:-hirepair}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirepair-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - hirepair_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hirepair_postgres_data:
  hirepair_redis_data:
